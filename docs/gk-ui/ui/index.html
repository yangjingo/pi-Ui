<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>uniEx PDF 分析助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>

<div id="app">
  <!-- Settings overlay -->
  <div id="settings-overlay" style="display:none">
    <div class="settings-backdrop"></div>
    <div class="settings-panel">
      <div class="settings-head">
        <h3>模型配置</h3>
        <button id="btn-close-settings" class="btn-icon">&times;</button>
      </div>
      <div class="settings-body">
        <label class="field">
          <span class="field-label">API Base URL</span>
          <input type="url" id="cfg-base-url" class="field-input"
                 placeholder="https://coding.dashscope.aliyuncs.com/v1"
                 autocomplete="off">
          <span class="field-hint">OpenAI / Anthropic 兼容接口地址</span>
        </label>
        <label class="field">
          <span class="field-label">API Key</span>
          <input type="password" id="cfg-api-key" class="field-input"
                 placeholder="sk-..."
                 autocomplete="off">
          <span class="field-hint">API 访问密钥</span>
        </label>
        <label class="field">
          <span class="field-label">Model</span>
          <input type="text" id="cfg-model" class="field-input"
                 placeholder="qwen3.7-plus"
                 autocomplete="off">
          <span class="field-hint">模型名称，如 qwen3.7-plus / kimi-k2.7 / gpt-4o</span>
        </label>
        <label class="field">
          <span class="field-label">Temperature</span>
          <input type="range" id="cfg-temperature" class="field-range" min="0" max="2" step="0.1" value="0.7">
          <span class="field-hint">生成温度：<span id="cfg-temp-val">0.7</span></span>
        </label>
      </div>
      <div class="settings-body" id="test-result-area" style="display:none">
        <div class="test-bubble">
          <div class="test-label">测试消息</div>
          <div class="test-sent">你好</div>
          <div class="test-label">模型回复 <span id="test-elapsed" class="test-elapsed"></span></div>
          <div class="test-reply" id="test-reply"></div>
        </div>
      </div>
      <div class="settings-foot">
        <span id="cfg-status" class="cfg-status"></span>
        <button id="btn-test-config" class="btn-secondary-sm">测试连接</button>
        <button id="btn-save-config" class="btn-primary">保存配置</button>
      </div>
    </div>
  </div>

  <!-- Main content -->
  <div id="main-area">
    <!-- Chat -->
    <section id="chat-area">
      <!-- Empty state -->
      <div id="empty-state">
        <div class="welcome-icon">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect x="8" y="4" width="32" height="40" rx="3" stroke="currentColor" stroke-width="2.5"/>
            <path d="M16 16h16M16 22h16M16 28h10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="32" cy="34" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M32 30v4l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2>上传 PDF 文档</h2>
        <p>自动提取文本、表格、图片，生成结构化分析报告</p>
        <div id="upload-zone-inline" class="upload-zone center-upload">
          <div class="upload-hint">
            <span>拖拽 PDF 文件或文件夹到此处，或</span>
            <button id="btn-browse-inline" class="btn-primary">选择文件</button>
          </div>
          <input type="file" id="file-input-inline" accept=".pdf" multiple hidden>
          <input type="file" id="folder-input-inline" webkitdirectory hidden>
        </div>
        <div class="welcome-actions">
          <button id="btn-settings-welcome" class="btn-secondary">模型配置</button>
          <button id="btn-new-chat-welcome" class="btn-secondary">新建对话</button>
        </div>
      </div>

      <!-- Message list -->
      <div id="message-list" style="display:none"></div>
    </section>

    <!-- Dashboard panel -->
    <aside id="dashboard-panel" style="display:none">
      <div class="panel-bar">
        <span class="panel-title">分析报告</span>
        <button id="btn-close-dashboard" class="btn-icon" title="关闭看板">&times;</button>
      </div>
      <iframe id="dashboard-iframe" src="" frameborder="0"></iframe>
    </aside>

    <!-- Canvas panel — message detail view -->
    <aside id="canvas-panel" style="display:none">
      <div class="panel-bar">
        <span class="panel-title" id="canvas-title">执行详情</span>
        <div class="panel-bar-actions">
          <button id="btn-canvas-prev" class="btn-icon" title="上一条">←</button>
          <button id="btn-canvas-next" class="btn-icon" title="下一条">→</button>
          <button id="btn-close-canvas" class="btn-icon" title="关闭">&times;</button>
        </div>
      </div>
      <div class="canvas-body" id="canvas-body">
        <p class="canvas-empty">点击左侧消息查看执行详情</p>
      </div>
    </aside>
  </div>

  <!-- Input area -->
  <footer id="input-area" style="display:none">
    <div id="file-tags" style="display:none"></div>
    <div id="upload-mini" class="upload-zone">
      <span>拖拽文件或文件夹，或</span>
      <button id="btn-browse" class="btn-text-sm">浏览文件</button>
      <input type="file" id="file-input" accept=".pdf" multiple hidden>
      <input type="file" id="folder-input" webkitdirectory hidden>
    </div>
    <div id="input-row">
      <textarea id="msg-input" rows="1" placeholder="输入消息，或直接上传 PDF 自动分析..."></textarea>
      <button id="btn-send" title="发送">&uarr;</button>
    </div>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
